# ODK Central OData endpoints.
#
# Central's `$`-prefixed OData argument names trigger CRS SQLi rule 942290.
# Remove that rule only on documented OData GET routes. `$filter` expressions
# using functions and comparisons can also trigger libinjection rule 942100
# and SQL-function rule 942151; remove them only when that argument is present.
# All remaining SQLi rules and other CRS protections continue to inspect these
# requests.
#
# The optional /key/:token/ prefix is rewritten by Central's backend after the
# request reaches it. `?st=:token` is similarly handled by the backend and does
# not appear in REQUEST_URI, so both forms remain covered by this path match.
SecRule REQUEST_METHOD "@streq GET" "id:1000201,phase:1,pass,nolog,chain"
  SecRule REQUEST_FILENAME "@rx ^/v1/(?:key/[^/]+/)?projects/[0-9]+/(?:forms/[^/]+(?:\.svc|/draft\.svc)|datasets/[^/]+\.svc)(?:/.*)?$" \
    "t:none,ctl:ruleRemoveById=942290"

SecRule REQUEST_METHOD "@streq GET" "id:1000202,phase:1,pass,nolog,chain"
  SecRule REQUEST_FILENAME "@rx ^/v1/(?:key/[^/]+/)?projects/[0-9]+/(?:forms/[^/]+(?:\.svc|/draft\.svc)|datasets/[^/]+\.svc)(?:/.*)?$" \
    "t:none,chain"
    SecRule ARGS_NAMES "@streq $filter" \
      "t:none,ctl:ruleRemoveById=942100,ctl:ruleRemoveById=942151"
